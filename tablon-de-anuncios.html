<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tablón de anuncios</title><style>*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:3px;font-family:system-ui,sans-serif}.banner{min-height:104px;position:relative;display:flex;align-items:center;gap:clamp(10px,3vw,24px);padding:12px clamp(12px,4vw,32px);overflow:hidden;border-radius:10px;background:linear-gradient(115deg,#004b7a,#0060A0);color:#FFFFFF;border-bottom:4px solid #70B7E1}.banner:before,.banner:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.banner:before{width:260px;height:170px;right:-90px;bottom:-130px;border:20px solid #70B7E1;transform:rotate(-25deg)}.banner:after{width:200px;height:140px;right:-100px;top:-110px;border:12px solid #D6EFF5}.symbol{font-size:clamp(30px,6vw,44px);width:56px;text-align:center;flex-shrink:0;animation-duration:3s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}.words{position:relative;z-index:1}h1{font:bold clamp(18px,4vw,30px)/1.1 Georgia,serif;margin:0}p{font-size:clamp(12px,2vw,15px);color:#E6F4F6;margin:5px 0 0}.bulb{animation-name:glow}.game{animation-name:rock}.books{animation-name:float}@keyframes float{50%{transform:translateY(-6px)}}@keyframes glow{50%{filter:drop-shadow(0 0 12px orange);transform:scale(1.09)}}@keyframes rock{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}@media(prefers-reduced-motion:reduce){.symbol{animation:none}}.symbol{animation-iteration-count:1}</style></head><body><header class="banner"><span class="symbol game" aria-hidden="true">📣</span><div class="words"><h1>Tablón de anuncios</h1><p>Novedades, comunicaciones y avisos importantes.</p></div></header></body></html>
